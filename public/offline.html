<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1714"><title>Scholarship Command Center · Offline</title><style>body{margin:0;background:#07110f;color:#eaf8f4;font:15px system-ui;padding:24px}main{max-width:760px;margin:auto}h1{font-size:26px}p{color:#9fb5af}.card{background:#10201c;border:1px solid #28413a;border-radius:14px;padding:15px;margin:10px 0}.card strong{display:block}.card span{color:#a8bdb7;font-size:13px}a{color:#65ddc2}</style><main><p>CSE SCHOLARSHIP COMMAND CENTER</p><h1>Limited offline view</h1><p>Only scholarship names and public dates are saved here. Your CGPA, IELTS target, fit, notes, checklist and application progress are never cached offline.</p><div id="list">Loading saved public dates…</div></main><script>fetch('/offline-data.json').then(r=>r.json()).then(d=>{document.querySelector('#list').innerHTML='<p>Snapshot: '+new Date(d.savedAt).toLocaleString()+'</p>'+d.scholarships.map(s=>'<div class="card"><strong>'+s.shortName+'</strong><span>'+s.country+' · Opens '+(s.opens||'not announced')+' · Deadline '+(s.deadline||'not announced')+'</span></div>').join('')}).catch(()=>document.querySelector('#list').textContent='No offline snapshot is available yet. Reconnect and open the dashboard once.')</script></html>
